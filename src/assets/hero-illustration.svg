<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none" aria-label="Team collaboration illustration">
  <!-- Background decorative circle -->
  <circle cx="320" cy="200" r="160" fill="#f0edff" opacity="0.5"/>
  <circle cx="320" cy="200" r="120" fill="#edf5ff" opacity="0.4"/>

  <!-- Desk / table surface -->
  <ellipse cx="300" cy="310" rx="200" ry="30" fill="#e8e9ec" opacity="0.5"/>

  <!-- Laptop - center -->
  <rect x="235" y="220" width="130" height="85" rx="8" fill="#4f6ef7" opacity="0.9"/>
  <rect x="241" y="226" width="118" height="70" rx="5" fill="#eef1ff"/>
  <!-- Screen content lines -->
  <rect x="250" y="235" width="60" height="5" rx="2" fill="#4f6ef7" opacity="0.4"/>
  <rect x="250" y="245" width="80" height="4" rx="2" fill="#9b59b6" opacity="0.4"/>
  <rect x="250" y="254" width="50" height="4" rx="2" fill="#00bcd4" opacity="0.4"/>
  <rect x="250" y="263" width="70" height="4" rx="2" fill="#ff6b35" opacity="0.3"/>
  <!-- Laptop base -->
  <rect x="215" y="305" width="170" height="10" rx="4" fill="#9b59b6" opacity="0.7"/>

  <!-- Person 1 — left, standing -->
  <!-- Body -->
  <rect x="140" y="185" width="44" height="80" rx="12" fill="#ff6b35" opacity="0.85"/>
  <!-- Head -->
  <circle cx="162" cy="168" r="22" fill="#ffb347"/>
  <!-- Hair -->
  <ellipse cx="162" cy="150" rx="20" ry="10" fill="#4a3000"/>
  <!-- Eyes -->
  <circle cx="156" cy="168" r="3" fill="#4a3000"/>
  <circle cx="168" cy="168" r="3" fill="#4a3000"/>
  <!-- Smile -->
  <path d="M155 177 Q162 183 169 177" stroke="#4a3000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Arm pointing at laptop -->
  <path d="M184 215 Q210 230 240 240" stroke="#ff6b35" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Person 2 — right, seated -->
  <!-- Body -->
  <rect x="400" y="210" width="44" height="70" rx="12" fill="#4f6ef7" opacity="0.85"/>
  <!-- Head -->
  <circle cx="422" cy="195" r="22" fill="#f4c2a1"/>
  <!-- Hair -->
  <ellipse cx="422" cy="177" rx="20" ry="10" fill="#222"/>
  <!-- Eyes -->
  <circle cx="416" cy="195" r="3" fill="#222"/>
  <circle cx="428" cy="195" r="3" fill="#222"/>
  <!-- Smile -->
  <path d="M415 204 Q422 210 429 204" stroke="#222" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Arm on laptop-side -->
  <path d="M400 230 Q370 240 365 250" stroke="#4f6ef7" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Floating idea elements -->
  <!-- Lightbulb -->
  <circle cx="480" cy="100" r="20" fill="#fffbeb" stroke="#f9a825" stroke-width="2"/>
  <path d="M480 92 C474 92 470 96 470 101 C470 106 474 109 476 111 L476 115 L484 115 L484 111 C486 109 490 106 490 101 C490 96 486 92 480 92Z" fill="#f9a825" opacity="0.7"/>
  <rect x="476" y="115" width="8" height="3" rx="1" fill="#f9a825"/>

  <!-- Gear -->
  <circle cx="100" cy="120" r="18" fill="#edf5ff" stroke="#4f6ef7" stroke-width="2"/>
  <circle cx="100" cy="120" r="8" fill="#4f6ef7" opacity="0.6"/>
  <!-- Gear teeth (simplified) -->
  <rect x="97" y="100" width="6" height="8" rx="2" fill="#4f6ef7" opacity="0.5"/>
  <rect x="97" y="132" width="6" height="8" rx="2" fill="#4f6ef7" opacity="0.5"/>
  <rect x="80" y="117" width="8" height="6" rx="2" fill="#4f6ef7" opacity="0.5"/>
  <rect x="112" y="117" width="8" height="6" rx="2" fill="#4f6ef7" opacity="0.5"/>

  <!-- Chat bubble -->
  <rect x="160" y="80" width="100" height="45" rx="12" fill="#f0edff"/>
  <path d="M180 125 L172 140 L192 125" fill="#f0edff"/>
  <rect x="173" y="95" width="75" height="6" rx="3" fill="#9b59b6" opacity="0.5"/>
  <rect x="173" y="107" width="55" height="5" rx="2" fill="#4f6ef7" opacity="0.4"/>

  <!-- Stars / sparkles -->
  <text x="340" y="90" font-size="18" fill="#ff6b35" opacity="0.7">✦</text>
  <text x="120" y="180" font-size="12" fill="#9b59b6" opacity="0.6">✦</text>
  <text x="460" y="180" font-size="14" fill="#4f6ef7" opacity="0.6">✦</text>
</svg>
