<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none" role="img" aria-label="BrainMint logo">
  <!-- Brain icon: simplified neural/mint leaf shape -->
  <circle cx="24" cy="30" r="14" fill="#4f6ef7" opacity="0.15"/>
  <!-- Left lobe -->
  <path d="M14 26 C14 18, 24 16, 28 22 C32 16, 42 18, 42 26 C42 36, 28 42, 28 38 C28 42, 14 36, 14 26Z"
        fill="none" stroke="#4f6ef7" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Neural dots -->
  <circle cx="22" cy="25" r="2.5" fill="#9b59b6"/>
  <circle cx="28" cy="21" r="2.5" fill="#4f6ef7"/>
  <circle cx="34" cy="25" r="2.5" fill="#00bcd4"/>
  <circle cx="22" cy="33" r="2.5" fill="#ff6b35"/>
  <circle cx="34" cy="33" r="2.5" fill="#9b59b6"/>
  <!-- Neural connections -->
  <line x1="22" y1="25" x2="28" y2="21" stroke="#4f6ef7" stroke-width="1" opacity="0.6"/>
  <line x1="28" y1="21" x2="34" y2="25" stroke="#00bcd4" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="25" x2="22" y2="33" stroke="#9b59b6" stroke-width="1" opacity="0.6"/>
  <line x1="34" y1="25" x2="34" y2="33" stroke="#9b59b6" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="33" x2="34" y2="33" stroke="#4f6ef7" stroke-width="1" opacity="0.6"/>

  <!-- Wordmark -->
  <!-- "Brain" in dark -->
  <text x="54" y="28" font-family="Poppins,system-ui,sans-serif" font-size="20" font-weight="700" fill="#222222">Brain</text>
  <!-- "Mint" in orange -->
  <text x="104" y="28" font-family="Poppins,system-ui,sans-serif" font-size="20" font-weight="700" fill="#ff6b35">Mint</text>
  <!-- Subtitle -->
  <text x="54" y="45" font-family="Poppins,system-ui,sans-serif" font-size="9" font-weight="500" fill="#7a7a8a" letter-spacing="1.5">software consultancy</text>
</svg>
